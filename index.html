<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070a12" />
    <meta
      name="description"
      content="Portal Data Warga untuk membuka spreadsheet data warga berdasarkan RT."
    />
    <title>Portal Data Warga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "Inter",
                "ui-sans-serif",
                "system-ui",
                "-apple-system",
                "BlinkMacSystemFont",
                '"Segoe UI"',
                "sans-serif",
              ],
            },
            boxShadow: {
              glow: "0 20px 80px -28px rgba(56, 189, 248, 0.38)",
              button: "0 14px 32px -18px rgba(56, 189, 248, 0.58)",
            },
            keyframes: {
              "gradient-shift": {
                "0%, 100%": { backgroundPosition: "0% 50%" },
                "50%": { backgroundPosition: "100% 50%" },
              },
              float: {
                "0%, 100%": { transform: "translate3d(0, 0, 0)" },
                "50%": { transform: "translate3d(0, -18px, 0)" },
              },
              "fade-up": {
                "0%": { opacity: "0", transform: "translateY(18px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              shimmer: {
                "0%": { transform: "translateX(-150%) skewX(-18deg)" },
                "100%": { transform: "translateX(280%) skewX(-18deg)" },
              },
              "spin-slow": {
                to: { transform: "rotate(360deg)" },
              },
            },
            animation: {
              "gradient-shift": "gradient-shift 16s ease infinite",
              float: "float 7s ease-in-out infinite",
              "fade-up": "fade-up 700ms cubic-bezier(0.16, 1, 0.3, 1) both",
              shimmer: "shimmer 850ms ease-out",
              "spin-slow": "spin-slow 900ms linear infinite",
            },
          },
        },
      };
    </script>
    <style>
      html {
        color-scheme: dark;
        background: #070a12;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        -webkit-tap-highlight-color: transparent;
      }

      .safe-area {
        padding-top: max(1.25rem, env(safe-area-inset-top));
        padding-right: max(1.25rem, env(safe-area-inset-right));
        padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
        padding-left: max(1.25rem, env(safe-area-inset-left));
      }

      .noise {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
      }

      .particle {
        animation: drift var(--duration) ease-in-out infinite alternate;
        animation-delay: var(--delay);
      }

      @keyframes drift {
        from {
          transform: translate3d(0, 0, 0);
          opacity: 0.22;
        }
        to {
          transform: translate3d(var(--x), var(--y), 0);
          opacity: 0.72;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>
  <body
    class="overflow-x-hidden bg-[#070a12] font-sans text-slate-100 antialiased"
  >
    <main
      class="safe-area relative isolate flex min-h-screen min-h-[100svh] items-center justify-center overflow-hidden"
      aria-labelledby="page-title"
    >
      <div
        class="absolute inset-0 -z-30 animate-gradient-shift bg-[length:220%_220%] bg-gradient-to-br from-[#070a12] via-[#0c1831] to-[#11112c]"
      ></div>
      <div
        class="noise pointer-events-none absolute inset-0 -z-10 opacity-[0.075]"
      ></div>
      <div
        class="pointer-events-none absolute -left-32 top-[-8rem] -z-20 h-80 w-80 animate-float rounded-full bg-cyan-400/20 blur-[100px] sm:h-[28rem] sm:w-[28rem]"
      ></div>
      <div
        class="pointer-events-none absolute -bottom-40 -right-32 -z-20 h-96 w-96 animate-float rounded-full bg-indigo-500/20 blur-[110px] [animation-delay:-3s] sm:h-[32rem] sm:w-[32rem]"
      ></div>
      <div
        class="pointer-events-none absolute left-[54%] top-[12%] -z-20 h-52 w-52 rounded-full bg-violet-500/10 blur-[90px]"
      ></div>

      <div
        id="particles"
        class="pointer-events-none absolute inset-0 -z-10"
        aria-hidden="true"
      ></div>

      <section
        class="relative w-full max-w-[42rem] animate-fade-up overflow-hidden rounded-[1.75rem] border border-white/[0.13] bg-slate-950/55 p-5 shadow-glow backdrop-blur-2xl sm:rounded-[2rem] sm:p-8 md:p-10"
        aria-label="Pilihan RT"
      >
        <div
          class="pointer-events-none absolute inset-px -z-10 rounded-[calc(1.75rem-1px)] bg-gradient-to-b from-white/[0.08] to-transparent sm:rounded-[calc(2rem-1px)]"
        ></div>
        <div
          class="pointer-events-none absolute -right-20 -top-20 -z-10 h-56 w-56 rounded-full bg-cyan-400/[0.09] blur-3xl"
        ></div>

        <div class="mb-7 flex justify-center sm:mb-8">
          <div
            class="relative flex h-20 w-20 items-center justify-center rounded-3xl border border-cyan-300/25 bg-gradient-to-br from-cyan-300/[0.18] via-sky-400/[0.1] to-indigo-500/[0.16] shadow-[0_18px_48px_-18px_rgba(34,211,238,0.48)] sm:h-24 sm:w-24"
            aria-hidden="true"
          >
            <div
              class="absolute inset-2 rounded-[1.15rem] border border-white/[0.08] bg-white/[0.035]"
            ></div>
            <svg
              class="relative h-10 w-10 text-cyan-200 sm:h-12 sm:w-12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 21h18" />
              <path d="M5 21V7l7-4 7 4v14" />
              <path d="M9 9h1" />
              <path d="M14 9h1" />
              <path d="M9 13h1" />
              <path d="M14 13h1" />
              <path d="M10 21v-4h4v4" />
            </svg>
          </div>
        </div>

        <header class="mx-auto max-w-xl text-center">
          <!-- <p
            class="mb-3 text-[0.68rem] font-bold uppercase tracking-[0.28em] text-cyan-300/90 sm:text-xs"
          >
            PENCATATAN HASIL PELAYANAN ORI CAMPAK RUBELA
          </p> -->
          <h1
            id="page-title"
            class="bg-gradient-to-b from-white via-slate-100 to-slate-400 bg-clip-text text-3xl font-bold tracking-[-0.045em] text-transparent sm:text-4xl md:text-4xl md:leading-tight"
          >
            PENCATATAN HASIL PELAYANAN ORI CAMPAK RUBELA
          </h1>
          <p
            class="mx-auto mt-4 max-w-md text-sm leading-6 text-cyan-300/90 sm:text-base sm:leading-7"
          >
            Silakan pilih RT untuk membuka spreadsheet.
          </p>
        </header>

        <div
          class="my-7 h-px bg-gradient-to-r from-transparent via-white/[0.14] to-transparent sm:my-8"
        ></div>

        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4" role="list">
          <a
            class="rt-button group relative isolate flex min-h-[5.25rem] cursor-pointer items-center gap-4 overflow-hidden rounded-2xl border border-cyan-300/[0.2] bg-cyan-300/[0.075] px-5 py-4 shadow-button transition duration-300 ease-out hover:-translate-y-1 hover:border-cyan-200/50 hover:bg-cyan-300/[0.13] hover:shadow-[0_20px_38px_-18px_rgba(34,211,238,0.62)] active:translate-y-0 active:scale-[0.985] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-cyan-300/60"
            href="https://docs.google.com/spreadsheets/d/1RiOEU90BP2a0GyVuPRbNnOMVDENPnveOZ-4R1gXPHH0/edit?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Buka spreadsheet data warga Kelurahan 15 ULU di tab baru"
            data-rt="Kelurahan 15 ULU"
            role="listitem"
          >
            <span
              class="pointer-events-none absolute inset-y-0 left-0 -z-10 w-1/3 -translate-x-[150%] skew-x-[-18deg] bg-gradient-to-r from-transparent via-white/15 to-transparent group-hover:animate-shimmer"
            ></span>
            <span
              class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl border border-cyan-200/20 bg-cyan-200/[0.11] text-cyan-100 transition duration-300 group-hover:bg-cyan-200/[0.18]"
              aria-hidden="true"
            >
              <svg
                class="h-6 w-6"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"
                />
                <path d="M14 2v6h6" />
                <path d="M8 13h8" />
                <path d="M8 17h8" />
                <path d="M8 9h2" />
              </svg>
            </span>
            <span class="min-w-0 flex-1">
              <span
                class="block text-xs font-semibold uppercase tracking-[0.18em] text-cyan-200/70"
                >Data Kelurahan
              </span>
              <span
                class="mt-1 block text-lg font-bold tracking-tight text-white"
                >15 ULU</span
              >
            </span>
            <span
              class="text-cyan-200/80 transition-transform duration-300 group-hover:translate-x-1"
              aria-hidden="true"
            >
              <svg
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 12h14" />
                <path d="m13 6 6 6-6 6" />
              </svg>
            </span>
          </a>

          <a
            class="rt-button group relative isolate flex min-h-[5.25rem] cursor-pointer items-center gap-4 overflow-hidden rounded-2xl border border-indigo-300/[0.2] bg-indigo-300/[0.075] px-5 py-4 shadow-button transition duration-300 ease-out hover:-translate-y-1 hover:border-indigo-200/50 hover:bg-indigo-300/[0.13] hover:shadow-[0_20px_38px_-18px_rgba(129,140,248,0.62)] active:translate-y-0 active:scale-[0.985] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-indigo-300/60"
            href="https://docs.google.com/spreadsheets/d/1XENh4sEun5fPsx3EJ3GuX_dt7P8YSWTFRVC3l74Nzgo/edit?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Buka spreadsheet data warga Kelurahan Tuan Kentang di tab baru"
            data-rt="Kelurahan Tuan Kentang"
            role="listitem"
          >
            <span
              class="pointer-events-none absolute inset-y-0 left-0 -z-10 w-1/3 -translate-x-[150%] skew-x-[-18deg] bg-gradient-to-r from-transparent via-white/15 to-transparent group-hover:animate-shimmer"
            ></span>
            <span
              class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl border border-indigo-200/20 bg-indigo-200/[0.11] text-indigo-100 transition duration-300 group-hover:bg-indigo-200/[0.18]"
              aria-hidden="true"
            >
              <svg
                class="h-6 w-6"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"
                />
                <path d="M14 2v6h6" />
                <path d="M8 13h8" />
                <path d="M8 17h8" />
                <path d="M8 9h2" />
              </svg>
            </span>
            <span class="min-w-0 flex-1">
              <span
                class="block text-xs font-semibold uppercase tracking-[0.18em] text-indigo-200/70"
                >Data Kelurahan</span
              >
              <span
                class="mt-1 block text-lg font-bold tracking-tight text-white"
                >Tuan Kentang</span
              >
            </span>
            <span
              class="text-indigo-200/80 transition-transform duration-300 group-hover:translate-x-1"
              aria-hidden="true"
            >
              <svg
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 12h14" />
                <path d="m13 6 6 6-6 6" />
              </svg>
            </span>
          </a>
        </div>

        <p
          class="mt-6 flex items-center justify-center gap-2 text-center text-xs leading-5 text-slate-400 sm:text-sm"
        >
          <svg
            class="h-4 w-4 shrink-0 text-emerald-300/80"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
          Tautan akan dibuka di tab baru.
        </p>
      </section>

      <footer
        class="absolute bottom-0 left-0 right-0 px-4 pb-[max(1rem,env(safe-area-inset-bottom))] text-center"
      >
        <p class="text-xs tracking-wide text-slate-400/80">
          &copy; 2026 Portal Data Warga
        </p>
      </footer>

      <div
        id="loading-overlay"
        class="pointer-events-none fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 opacity-0 backdrop-blur-md transition-opacity duration-300"
        role="status"
        aria-live="polite"
        aria-hidden="true"
      >
        <div
          class="flex flex-col items-center gap-4 rounded-2xl border border-white/10 bg-slate-900/80 px-7 py-6 shadow-2xl"
        >
          <svg
            class="h-8 w-8 animate-spin-slow text-cyan-300"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle
              class="opacity-20"
              cx="12"
              cy="12"
              r="9"
              stroke="currentColor"
              stroke-width="3"
            />
            <path
              class="opacity-90"
              d="M21 12a9 9 0 0 0-9-9"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />
          </svg>
          <p
            id="loading-text"
            class="text-sm font-semibold tracking-wide text-slate-100"
          >
            Membuka spreadsheet...
          </p>
        </div>
      </div>
    </main>

    <script>
      /*
       * Keeping spreadsheet URLs here makes future updates quick and low-risk.
       */
      const spreadsheetUrls = {
        "Kelurahan 15 ULU":
          "https://docs.google.com/spreadsheets/d/1RiOEU90BP2a0GyVuPRbNnOMVDENPnveOZ-4R1gXPHH0/edit?usp=sharing",
        "Kelurahan Tuan Kentang":
          "https://docs.google.com/spreadsheets/d/1XENh4sEun5fPsx3EJ3GuX_dt7P8YSWTFRVC3l74Nzgo/edit?usp=sharing",
      };

      const particlesContainer = document.getElementById("particles");
      const overlay = document.getElementById("loading-overlay");
      const loadingText = document.getElementById("loading-text");
      const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;

      const makeParticles = () => {
        if (reduceMotion) return;

        const count = window.innerWidth < 640 ? 12 : 20;
        const fragment = document.createDocumentFragment();

        for (let index = 0; index < count; index += 1) {
          const particle = document.createElement("span");
          const size = Math.random() * 2.4 + 1;
          particle.className = "particle absolute rounded-full bg-cyan-100";
          particle.style.width = `${size}px`;
          particle.style.height = `${size}px`;
          particle.style.left = `${Math.random() * 100}%`;
          particle.style.top = `${Math.random() * 100}%`;
          particle.style.setProperty("--x", `${Math.random() * 42 - 21}px`);
          particle.style.setProperty("--y", `${Math.random() * 56 - 28}px`);
          particle.style.setProperty("--duration", `${Math.random() * 5 + 5}s`);
          particle.style.setProperty("--delay", `${Math.random() * -6}s`);
          fragment.appendChild(particle);
        }

        particlesContainer.appendChild(fragment);
      };

      document.querySelectorAll(".rt-button").forEach((button) => {
        const rtName = button.dataset.rt;
        button.href = spreadsheetUrls[rtName];

        button.addEventListener("click", () => {
          loadingText.textContent = `Membuka spreadsheet ${rtName}...`;
          overlay.classList.remove("pointer-events-none", "opacity-0");
          overlay.classList.add("opacity-100");
          overlay.setAttribute("aria-hidden", "false");

          window.setTimeout(() => {
            overlay.classList.add("pointer-events-none", "opacity-0");
            overlay.classList.remove("opacity-100");
            overlay.setAttribute("aria-hidden", "true");
          }, 950);
        });
      });

      makeParticles();
    </script>
  </body>
</html>
